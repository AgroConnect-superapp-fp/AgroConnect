services:
  - type: web
    name: agroconnect-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: cd .. && npm ci --include=dev && npm run build -w @agroconnect/contracts && cd backend && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: agroconnect
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://agroconnectpreview.vercel.app
      - key: APP_BASE_URL
        value: https://agroconnectpreview.vercel.app
      - key: RATE_LIMIT_MAX_ATTEMPTS
        value: '30'
      - key: TRUST_PROXY
        value: '1'
      - key: LOG_LEVEL
        value: info
