services:
  - type: web
    name: agroconnect-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.3
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://agroconnectpreview.vercel.app,http://localhost:5173
      - key: APP_BASE_URL
        value: https://agroconnectpreview.vercel.app
      - key: RATE_LIMIT_MAX_ATTEMPTS
        value: '30'
      - key: LOG_LEVEL
        value: info
