name: CI — AgroConnect

on:
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DATABASE_URL_TEST: postgresql://agroconnect:agroconnect_dev@localhost:5432/agroconnect_test?schema=public

jobs:
  backend:
    name: Backend — lint, tipos y pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: agroconnect
          POSTGRES_PASSWORD: agroconnect_dev
          POSTGRES_DB: agroconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agroconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - name: Lint (0 errores permitidos)
        run: npm run lint

      - name: Type check (0 errores permitidos)
        run: npm run typecheck

      - name: Aplicar migraciones en la base de pruebas
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - name: Pruebas unitarias e integración con cobertura
        run: npm test -- --coverage
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
          TEST_DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
          JWT_ACCESS_SECRET: ci_access_secret_with_at_least_32_characters_ok
          JWT_REFRESH_SECRET: ci_refresh_secret_with_at_least_32_characters_ok
          LOG_LEVEL: fatal

      # Bloquea vulnerabilidades high/critical; las moderate/low se reportan sin
      # bloquear. Hoy provienen de la toolchain de pruebas (jest → sprintf-js),
      # sin fix disponible que no introduzca un cambio incompatible
      # (ver auditoría de seguridad 2026-10-06).
      - name: Auditoría de dependencias (SAST)
        run: npm audit --audit-level=high

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  frontend:
    name: Frontend — lint, tipos y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (0 errores permitidos)
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Build de producción
        run: npm run build

      # Bloquea vulnerabilidades high/critical; las moderate/low se reportan sin
      # bloquear. Hoy provienen de la toolchain de pruebas (jest → sprintf-js),
      # sin fix disponible que no introduzca un cambio incompatible
      # (ver auditoría de seguridad 2026-10-06).
      - name: Auditoría de dependencias (SAST)
        run: npm audit --audit-level=high

  e2e:
    name: E2E — registro y autenticación
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: agroconnect
          POSTGRES_PASSWORD: agroconnect_dev
          POSTGRES_DB: agroconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agroconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: backend

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend

      - name: Preparar base de datos de pruebas
        run: npx prisma generate && npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: 'true'
          TEST_DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - name: Publicar reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy a producción (Vercel)
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_ORG_ID: team_IPTpVtm8CrxhxB4qo8AFvV4j
      VERCEL_PROJECT_ID: prj_B1w9PUpDOqV9P104MgoVk61vDnab
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Aviso si falta VERCEL_TOKEN
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::VERCEL_TOKEN no configurado. Agrega el secret para habilitar el deploy automatico."

      - name: Configurar Node.js
        if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        if: env.VERCEL_TOKEN != ''
        run: npm ci

      - name: Pull de configuración y entorno (Vercel)
        id: vercel_pull
        if: env.VERCEL_TOKEN != ''
        run: |
          if npx --yes vercel@54 pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "access=true" >> "$GITHUB_OUTPUT"
          else
            echo "access=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN sin acceso al equipo AgroConnect - deploy automatico omitido. Usa el deploy manual documentado (npx vercel deploy --prod --yes --archive=tgz)."
          fi
        working-directory: .

      - name: Build de producción (Vercel)
        if: steps.vercel_pull.outputs.access == 'true'
        run: npx --yes vercel@54 build --prod --token="$VERCEL_TOKEN"
        working-directory: .

      - name: Deploy a producción
        if: steps.vercel_pull.outputs.access == 'true'
        run: npx --yes vercel@54 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
        working-directory: .

  alignment:
    name: Alineación de entornos (manifiesto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verificar README contra el manifiesto de sincronización
        run: node tools/alignment-check/check-alignment.mjs --ci
