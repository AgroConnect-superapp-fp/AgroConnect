name: CI — AgroConnect

on:
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DATABASE_URL_TEST: postgresql://agroconnect:agroconnect_dev@localhost:5432/agroconnect_test?schema=public

jobs:
  backend:
    name: Backend — lint, tipos y pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: agroconnect
          POSTGRES_PASSWORD: agroconnect_dev
          POSTGRES_DB: agroconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agroconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - name: Lint (0 errores permitidos)
        run: npm run lint

      - name: Type check (0 errores permitidos)
        run: npm run typecheck

      - name: Aplicar migraciones en la base de pruebas
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - name: Pruebas unitarias e integración con cobertura
        run: npm test -- --coverage
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
          TEST_DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
          JWT_ACCESS_SECRET: ci_access_secret_with_at_least_32_characters_ok
          JWT_REFRESH_SECRET: ci_refresh_secret_with_at_least_32_characters_ok
          LOG_LEVEL: fatal

      - name: Auditoría de dependencias (SAST)
        run: npm audit

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  frontend:
    name: Frontend — lint, tipos y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (0 errores permitidos)
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Build de producción
        run: npm run build

      - name: Auditoría de dependencias (SAST)
        run: npm audit

  e2e:
    name: E2E — registro y autenticación
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: agroconnect
          POSTGRES_PASSWORD: agroconnect_dev
          POSTGRES_DB: agroconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agroconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: backend

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend

      - name: Preparar base de datos de pruebas
        run: npx prisma generate && npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: 'true'
          TEST_DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - name: Publicar reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
