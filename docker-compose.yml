# ---------------------------------------------------------------------------
# AgroConnect — PostgreSQL 16 + PostGIS 3.4 para desarrollo local
#
#   docker compose up -d
#
# Coincide por defecto con el puerto 5434 y la base local `agroconnect_dev`
# esperados por apps/api/.env. El entorno administrado de producción usa la
# base `agroconnect` (ver docs/runbook-despliegue-postgres.md).
# El esquema de aplicación se define con DATABASE_SCHEMA.
# ---------------------------------------------------------------------------
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: agroconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agroconnect
      POSTGRES_PASSWORD: agroconnect_dev
      POSTGRES_DB: agroconnect_dev
    ports:
      # Solo loopback: la base de desarrollo no debe quedar expuesta a la LAN.
      - "127.0.0.1:5434:5432"
    volumes:
      - agroconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroconnect -d agroconnect_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agroconnect_pgdata:
    name: agroconnect_pgdata
